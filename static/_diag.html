<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览诊断</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; padding: 14px; }
  h3 { margin: 0 0 10px; }
  .row { margin: 7px 0; font-size: 14px; line-height: 1.5; word-break: break-all; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .wait { color: #fbbf24; }
  iframe { width: 100%; height: 50vh; border: 1px solid #444; margin-top: 10px; background: #fff; }
  .hint { color: #999; font-size: 12px; }
</style>
</head>
<body>
<h3>📱 手机端预览诊断（自运行）</h3>
<div class="hint">自动测试 Word/PPT 预览链路并回传结果，全程约 40 秒，跑完回一句「跑完了」即可。</div>
<div id="lines"></div>
<iframe id="app"></iframe>
<script>
const BASE = location.pathname.split("static/")[0];
const REPORT = [];
let beaconTimer = null;
function beacon() {
  clearTimeout(beaconTimer);
  beaconTimer = setTimeout(() => {
    new Image().src = BASE + "api/file?path=" + encodeURIComponent("DIAG_" + REPORT.join("|")).slice(0, 1500);
  }, 400);
}
function line(label, status, detail) {
  const d = document.createElement("div");
  d.className = "row " + (status === true ? "ok" : status === false ? "bad" : "wait");
  d.textContent = label + "：" + detail;
  document.getElementById("lines").appendChild(d);
  REPORT.push(label + "=" + String(detail).replace(/[|]/g, "/").slice(0, 80));
  beacon();
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("脚本加载失败"));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error("脚本加载超时20s")), 20000);
  });
}

const DOCX = "D:/Hermes对话保存位置/Hermes远程网站/uploads/_pv_sample.docx";
const PPTX = "D:/Hermes对话保存位置/Hermes远程网站/uploads/_pv_sample.pptx";
const docxUrl = BASE + "api/file?path=" + encodeURIComponent(DOCX);
const pptxUrl = BASE + "api/file?path=" + encodeURIComponent(PPTX);

(async () => {
  line("环境", null, navigator.userAgent.slice(0, 70));
  line("网址", null, location.href.slice(0, 70));
  line("联网", navigator.onLine, navigator.onLine ? "在线" : "离线");

  // ---- Word ----
  let buf = null;
  try {
    const resp = await fetch(docxUrl);
    if (resp.ok) buf = await resp.arrayBuffer();
    line("取Word文件", resp.ok, "HTTP " + resp.status + (buf ? " " + buf.byteLength + "字节" : ""));
  } catch (e) { line("取Word文件", false, "异常 " + e.message); }

  let mammothOk = false;
  try {
    await loadScript(BASE + "static/mammoth.browser.min.js?v=20261021a");
    mammothOk = typeof window.mammoth !== "undefined" && typeof window.mammoth.convertToHtml === "function";
    line("Word渲染库", mammothOk, mammothOk ? "mammoth就绪" : "mammoth未导出");
  } catch (e) { line("Word渲染库", false, e.message); }

  if (buf && mammothOk) {
    try {
      const r = await window.mammoth.convertToHtml({ arrayBuffer: buf });
      const html = r.value || "";
      line("Word转HTML", html.length > 200, "长度 " + html.length);
      const inner = document.createElement("div");
      inner.style.cssText = "background:#fff;color:#000;padding:8px;max-height:160px;overflow:auto";
      inner.innerHTML = html;
      document.body.appendChild(inner);
      line("Word显示测试", inner.getBoundingClientRect().height > 20, "内容高度 " + Math.round(inner.getBoundingClientRect().height) + "px");
    } catch (e) { line("Word转HTML", false, "异常 " + e.message); }
  } else { line("Word转HTML", false, "跳过（前置失败）"); }

  // ---- PPT ----
  let pbuf = null;
  try {
    const resp = await fetch(pptxUrl);
    if (resp.ok) pbuf = await resp.arrayBuffer();
    line("取PPT文件", resp.ok, "HTTP " + resp.status + (pbuf ? " " + pbuf.byteLength + "字节" : ""));
  } catch (e) { line("取PPT文件", false, "异常 " + e.message); }

  try {
    await loadScript(BASE + "static/jszip.min.js?v=20261021a");
    await loadScript(BASE + "static/chart.umd.min.js?v=20261021a");
    await loadScript(BASE + "static/PptxViewJS.min.js?v=20261021a");
    line("PPT渲染库", typeof window.PptxViewJS !== "undefined", "PptxViewJS就绪");
  } catch (e) { line("PPT渲染库", false, e.message); }

  if (pbuf && window.PptxViewJS) {
    try {
      const cv = document.createElement("canvas");
      cv.style.cssText = "max-width:100%;border:1px solid #666";
      document.body.appendChild(cv);
      const v = new window.PptxViewJS.PPTXViewer({ canvas: cv, slideSizeMode: "fit", backgroundColor: "#ffffff" });
      await v.loadFile(pbuf);
      await v.render(null, { slideIndex: 0 });
      line("PPT渲染测试", v.getSlideCount() > 0 && cv.height > 0, "共 " + v.getSlideCount() + " 页，画布 " + cv.width + "x" + cv.height);
    } catch (e) { line("PPT渲染测试", false, "异常 " + e.message); }
  } else { line("PPT渲染测试", false, "跳过（前置失败）"); }

  line("下载支持", "download" in document.createElement("a"), ("download" in document.createElement("a")) ? "a.download可用" : "不支持");

  // ---- 真实页面 previewFile ----
  try {
    const f = document.getElementById("app");
    await new Promise((res) => { f.onload = res; setTimeout(res, 6000); f.src = BASE; });
    await new Promise(r => setTimeout(r, 2500));
    const w = f.contentWindow;
    if (typeof w.previewFile !== "function") {
      line("previewFile", false, "未找到（页面JS未就绪）");
    } else {
      w.previewFile(encodeURIComponent(DOCX));
      await new Promise(r => setTimeout(r, 15000));
      const doc = f.contentDocument;
      const ov = doc.getElementById("pvOverlay");
      const bodyEl = doc.getElementById("pvBody");
      const len = bodyEl ? bodyEl.innerHTML.length : 0;
      const vis = ov && !ov.hidden && ov.getBoundingClientRect().height > 50;
      line("浮层打开", !!vis, vis ? "浮层可见" : "浮层未显示");
      line("浮层内容", len > 300, "HTML " + len + "字：" + (bodyEl ? bodyEl.textContent.slice(0, 40).replace(/\s+/g, " ") : ""));
    }
  } catch (e) { line("previewFile", false, "异常 " + e.message); }

  line("诊断", null, "结束");
})();
</script>
</body>
</html>
